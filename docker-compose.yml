version: '3.9'

services:
  postgres:
    image: timescale/timescaledb-ha:pg16-latest
    container_name: museumquest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: museumquest
      POSTGRES_PASSWORD: museumquest
      POSTGRES_DB: museumquest
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U museumquest -d museumquest']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: museumquest_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
